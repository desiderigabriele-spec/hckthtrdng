  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">

    <text x="600" y="350" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="150" font-weight="700" fill="#00FF41" style="filter:drop-shadow(0 0 24px rgba(0,255,65,.5))">[#01]</text>
    <text x="600" y="480" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="44" letter-spacing="8" fill="#E5E5E5">HACK_THE_TRADING</text>

  </svg>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- global matrix backdrop -->
<script>
(function () {
  var c = document.getElementById('matrix');
  if (!c) return;
  var ctx = c.getContext('2d'), fs = 15, drops = [], cols = 0, W, H;
  var glyphs = 'アカサタナ0123456789ABCDEF<>{}[]/$#*+=HTT'.split('');
  function size(){ W=c.width=innerWidth; H=c.height=innerHeight; cols=Math.floor(W/fs); drops=[]; for(var i=0;i<cols;i++)drops[i]=Math.random()*-40; }
  size(); addEventListener('resize', size);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  (function loop(){
    ctx.fillStyle='rgba(13,13,13,0.16)'; ctx.fillRect(0,0,W,H);
    ctx.font=fs+'px JetBrains Mono, monospace';
    for(var i=0;i<cols;i++){ var ch=glyphs[(Math.random()*glyphs.length)|0];
      ctx.fillStyle=Math.random()>0.97?'#aaffcc':'#00FF41';
      ctx.fillText(ch,i*fs,drops[i]*fs);
      if(drops[i]*fs>H&&Math.random()>0.975)drops[i]=0; drops[i]+=0.5+Math.random()*0.5; }
    setTimeout(function(){ requestAnimationFrame(loop); }, 55);
  })();
})();
</script>
